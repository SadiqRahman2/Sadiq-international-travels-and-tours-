    <!-- Safeguard against third-party browser extensions accessing miniProgram -->
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          try {
            if (!window.wx) {
              window.wx = {
                miniProgram: {
                  postMessage: function() {},
                  getEnv: function(cb) { if (typeof cb === 'function') cb({ miniprogram: false }); },
                  navigateTo: function() {},
                  navigateBack: function() {},
                  switchTab: function() {},
                  reLaunch: function() {},
                  redirectTo: function() {}
                }
              };
            }
            if (!window.my) {
              window.my = {
                postMessage: function() {},
                miniProgram: { postMessage: function() {} }
              };
            }
          } catch (e) {}

          // Suppress third-party extension error events from bubbling up
          window.addEventListener('error', function(e) {
            if (
              (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
              (e.message && e.message.indexOf('miniProgram') !== -1)
            ) {
              e.stopImmediatePropagation();
              e.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            var reason = e.reason;
            if (reason) {
              var str = (reason.stack || '') + (reason.message || '');
              if (str.indexOf('chrome-extension://') !== -1 || str.indexOf('miniProgram') !== -1) {
                e.stopImmediatePropagation();
                e.preventDefault();
                return true;
              }
            }
          }, true);
        }
      })();
    </script>
